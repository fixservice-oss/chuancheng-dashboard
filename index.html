    <div class="header">

    <div class="container">
        <!-- 儀表板數據 -->
        <div class="dashboard">
            <div class="card"><div class="card-icon"><i class="fa-solid fa-list"></i></div><div class="card-info"><h3>保養總筆數</h3><p id="count-total">0</p></div></div>

            <div class="card"><div class="card-icon"><i class="fa-solid fa-circle-exclamation" style="color:var(--danger)"></i></div><div class="card-info"><h3>已逾期筆數</h3><p id="count-overdue">0</p></div></div>
            <div class="card"><div class="card-icon"><i class="fa-solid fa-bell" style="color:var(--warning)"></i></div><div class="card-info"><h3>待提醒筆數 (30天內)</h3><p id="count-remind">0</p></div></div>
        </div>

        <div class="toolbar">
            <div class="toolbar-group">
                <input type="text" id="searchInput" class="search-box" placeholder="輸入客戶名稱搜尋..." onkeyup="handleSearch()">
            </div>
            <div class="toolbar-group">
                <div class="theme-selector">
                    <span><i class="fa-solid fa-palette"></i> 色系：</span>
                    <div class="theme-dot" style="background: #B8906F;" onclick="changeTheme('milktea')" title="奶茶色 (預設)"></div>
                    <div class="theme-dot" style="background: #E07A8D;" onclick="changeTheme('pink')" title="櫻花粉"></div>
                    <div class="theme-dot" style="background: #5C9EAD;" onclick="changeTheme('blue')" title="寧靜藍"></div>
                    <div class="theme-dot" style="background: #7E9F76;" onclick="changeTheme('green')" title="抹茶綠"></div>
                </div>
                <button class="btn" id="cloudSyncBtn" onclick="syncToCloud()" style="background-color: #27ae60;"><i class="fa-solid fa-cloud-arrow-up"></i> 同步至雲端</button>
                <button class="btn" onclick="openModal()"><i class="fa-solid fa-plus"></i> 新增登記保養</button>
                <input type="file" id="csvFileInput" accept=".csv" onchange="importCSV(event)">
                <button class="btn btn-outline" onclick="document.getElementById('csvFileInput').click()"><i class="fa-solid fa-file-import"></i> 匯入CSV</button>
                <button class="btn btn-outline" onclick="exportExcel()"><i class="fa-solid fa-file-export"></i> 匯出Excel</button>
                <button class="btn btn-danger-outline" onclick="clearAllData()"><i class="fa-solid fa-trash-can"></i> 格式化清除</button>
                <button class="btn btn-pack" onclick="exportHTML()"><i class="fa-solid fa-box-archive"></i> 儲存並打包網頁</button>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('tab-maintenance', this)">保養資訊</div>
            <div class="tab" onclick="switchTab('tab-customers', this)">客戶資訊與狀態</div>
            <div class="tab" onclick="switchTab('tab-history', this)">歷史保養紀錄</div>
        </div>

        <div id="tab-maintenance" class="tab-content active">
            <table>
                <thead>
                    <tr><th>保養日期</th><th>客戶名稱</th><th>保養項目</th><th>保養頻率</th><th>下次預計保養日</th><th>保養狀況</th><th>備註</th><th>操作</th></tr>
                </thead>
                <tbody id="maintenance-table-body"><tr><td colspan="8" class="text-center" style="text-align:center; padding:20px;">載入資料中...</td></tr></tbody>
            </table>
            <div id="pagination" class="pagination"></div>
        </div>

        <div id="tab-customers" class="tab-content">

                <thead><tr><th>客戶名稱</th><th>營業狀態 (點擊標籤可更改)</th></tr></thead>

        <!-- 歷史保養紀錄頁籤 -->
        <div id="tab-history" class="tab-content">
            <div class="toolbar" style="margin-bottom: 15px; gap: 15px; display: flex; flex-wrap: wrap;">
                <div>
                    <label>選擇年份：</label>
                    <select id="historyYearSelect" class="search-box" onchange="renderHistoryTable()" style="width: 120px;"><option value="all">全部</option></select>

                <table>
                    <thead><tr><th>保養日期</th><th>客戶名稱</th><th>保養項目</th><th>保養頻率</th><th>保養狀況</th></tr></thead>
                    <tbody id="history-table-body"></tbody>
                </table>
            </div>
        </div>

    <!-- Modals -->
    <div id="recordModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header"><h2 id="modalTitle">新增登記保養</h2><i class="fa-solid fa-xmark close-modal" onclick="closeModal()"></i></div>
            <form id="recordForm">
                <input type="hidden" id="recordId" value="">
                <div class="form-group"><label>保養日期</label><input type="date" id="mDate" class="form-control" required=""></div>
                <div class="form-group">
                    <label>客戶名稱</label>
                    <input list="customerList" id="mCustomer" class="form-control" required="" placeholder="請選擇或輸入客戶名稱" onblur="autoFillCustomerInfo(this.value)">
                    <datalist id="customerList"></datalist>
                </div>
                <div class="form-group">
                    <label>保養項目</label>
                    <input list="items" id="mItem" class="form-control" required="" placeholder="請選擇或輸入保養項目">
                    <datalist id="items">
                        <option value="靜電機保養"></option>
                        <option value="煙罩清洗"></option>
                        <option value="風管檢修"></option>
                        <option value="馬達軸承更換"></option>
                    </datalist>
                </div>
                <div class="form-group"><label>保養頻率 (月，可輸入小數如 1.5)</label><input type="number" id="mFreq" class="form-control" required="" min="0.5" step="0.5" placeholder="例如: 1 或 1.5"></div>
                <div class="form-group"><label>保養狀況</label><select id="mStatus" class="form-control"><option value="待處理">待處理</option><option value="已保養">已保養</option><option value="已逾期">已逾期</option></select></div>
                <div class="form-group"><label>備註</label><textarea id="mRemarks" class="form-control"></textarea></div>
                <div class="modal-footer"><button type="button" class="btn btn-outline" onclick="closeModal()">取消</button><button type="submit" class="btn">儲存</button></div>
            </form>
        </div>
    </div>

    <!-- 提醒通知視窗 -->
    <div id="reminderModal" class="modal" style="display: none;">
        <div class="modal-content large">
            <div class="modal-header">
                <h2><i class="fa-solid fa-bell" style="color:var(--warning)"></i> 下次保養提醒</h2>
                <i class="fa-solid fa-xmark close-modal" onclick="closeReminderModal()"></i>
            </div>
            <div style="margin-bottom: 15px;">
                <input type="text" id="reminderSearchInput" class="search-box" placeholder="🔍 輸入保養項目或客戶過濾..." onkeyup="filterReminderTable()" style="width: 100%; box-sizing: border-box;">
            </div>
            <div style="max-height: 350px; overflow-y: auto;">
                <table>
                    <thead><tr><th>下次保養日</th><th>客戶名稱</th><th>保養項目</th><th>距離天數</th></tr></thead>
                    <tbody id="reminder-table-body"></tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeReminderModal()">關閉</button>
                <button type="button" class="btn" onclick="exportReminderExcel()"><i class="fa-solid fa-file-export"></i> 匯出篩選後名單</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbytrz7cc_ziNZtRJvURLtAxgq9jhqJDUkWyasVPDFVnB90EHhGFY4ZThjVJpwUaQGbaEA/exec";

        const themeConfig = {
            milktea: { '--primary-color': '#B8906F', '--secondary-color': '#D2B48C', '--bg-color': '#F8F5F1', '--text-dark': '#4A3C31', '--text-light': '#7A6652', '--border-color': '#E6D5C3', '--hover-color': '#FDFBCA' },
            pink: { '--primary-color': '#E07A8D', '--secondary-color': '#F2B8C6', '--bg-color': '#FDF5F7', '--text-dark': '#5A3D43', '--text-light': '#8C6870', '--border-color': '#FAD5DF', '--hover-color': '#FFF0F3' },
            blue: { '--primary-color': '#5C9EAD', '--secondary-color': '#9BCCDA', '--bg-color': '#F0F8FA', '--text-dark': '#2B4A52', '--text-light': '#5B7B83', '--border-color': '#CBE4EA', '--hover-color': '#E6F4F8' },
            green: { '--primary-color': '#7E9F76', '--secondary-color': '#B1C8A9', '--bg-color': '#F4F7F2', '--text-dark': '#354531', '--text-light': '#5D7258', '--border-color': '#CFDEC9', '--hover-color': '#EEF5EB' }
        };

        function changeTheme(themeName) {
            const theme = themeConfig[themeName];
            if (!theme) return;
            for (let key in theme) document.documentElement.style.setProperty(key, theme[key]);
            localStorage.setItem('cc_theme', themeName);
        }

        function loadTheme() {
            let savedTheme = localStorage.getItem('cc_theme');
            if (window.EMBEDDED_THEME && window.EMBEDDED_TIMESTAMP > (parseInt(localStorage.getItem('cc_timestamp')) || 0)) savedTheme = window.EMBEDDED_THEME;
            changeTheme(savedTheme || 'milktea');
        }

        let records = []; let customers = {}; let currentPage = 1; let currentCustomerPage = 1; const recordsPerPage = 15;
        let currentReminderData = []; 

        window.onload = () => { loadTheme(); loadData(); };

        async function loadData() {
            let cloudLoaded = false;
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                if (Array.isArray(data) && data.length > 0) {
                    records = data.map(r => ({
                        id: r.id || Math.random().toString(36).substr(2,9),
                        date: r.date ? r.date.toString().split('T')[0].replace(/\//g, '-') : '',
                        customer: r.customer || '',
                        item: r.item || '',
                        freq: parseFloat(r.freq) || 1,
                        status: r.status || '待處理',
                        remarks: r.remarks || ''
                    }));
                    updateCustomerList();
                    cloudLoaded = true;
                }
            } catch (error) {
                console.log("從雲端載入失敗", error);
            }

            if (!cloudLoaded) {
                const savedRecords = localStorage.getItem('cc_records');
                if (savedRecords !== null) {
                    records = JSON.parse(savedRecords);
                    customers = JSON.parse(localStorage.getItem('cc_customers') || '{}');
                } else if (window.EMBEDDED_RECORDS && window.EMBEDDED_RECORDS.length > 0) {
                    records = window.EMBEDDED_RECORDS;
                    customers = window.EMBEDDED_CUSTOMERS || {};
                    saveData();
                } else {
                    records = [];
                    customers = {};
                }
            }
            renderAll();
            checkReminders(true);
        }

        async function syncToCloud() {
            saveData();
            const btn = document.getElementById('cloudSyncBtn');
            if(btn) { btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 同步中...'; btn.disabled = true; }
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(records)
                });
                alert('✅ 雲端同步成功！所有同事重新整理網頁即可看到最新資料。');
            } catch (error) {
                console.error(error);
                alert('❌ 雲端同步失敗，請檢查網路連線。');
            } finally {
                if(btn) { btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> 同步至雲端'; btn.disabled = false; }
            }
        }

        function saveData(overrideTimestamp = null) {
            const newTimestamp = overrideTimestamp || Date.now();
            localStorage.setItem('cc_timestamp', newTimestamp);
            localStorage.setItem('cc_records', JSON.stringify(records));
            localStorage.setItem('cc_customers', JSON.stringify(customers));
        }

        function updateCustomerDatalist() {
            const datalist = document.getElementById('customerList');
            datalist.innerHTML = '';
            Object.keys(customers).forEach(cName => {
                let opt = document.createElement('option');
                opt.value = cName;
                datalist.appendChild(opt);
            });
        }

        function autoFillCustomerInfo(customerName) {
            if (!customerName) return;
            const lastRecord = records.slice().reverse().find(r => r.customer.trim().toLowerCase() === customerName.trim().toLowerCase());
            if (lastRecord) {
                const itemInput = document.getElementById('mItem');
                const freqInput = document.getElementById('mFreq');
                if (itemInput && !itemInput.value) itemInput.value = lastRecord.item;
                if (freqInput && !freqInput.value) freqInput.value = lastRecord.freq;
            }
        }

        function renderMaintenanceTable(filterText) {
            const tbody = document.getElementById('maintenance-table-body'); tbody.innerHTML = '';
            const searchInput = document.getElementById('searchInput');
            const text = (filterText !== undefined && filterText !== '') ? filterText : (searchInput ? searchInput.value : '');

            let f = text ? records.filter(r => r.customer.toLowerCase().includes(text.toLowerCase())) : records;
            f.sort((a,b) => new Date(b.date) - new Date(a.date));
            
            const totalItems = f.length;
            const totalPages = Math.ceil(totalItems / recordsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const p = f.slice((currentPage-1)*recordsPerPage, currentPage*recordsPerPage);
            
            p.forEach(r => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${r.date.replace(/-/g, '/')}</td>
                    <td>${r.customer}</td>
                    <td>${r.item}</td>
                    <td>
                        <input type="number" value="${r.freq}" min="0.5" step="0.5" 
                               style="width: 60px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit;" 
                               onchange="updateRecordFreq('${r.id}', this.value)" title="直接修改頻率"> 月
                    </td>
                    <td>${calculateNextDate(r.date, r.freq).replace(/-/g, '/')}</td>
                    <td>
                        <select class="status-select" onchange="changeRecordStatus('${r.id}', this.value)">
                            <option value="待處理" ${r.status==='待處理'?'selected':''}>待處理</option>
                            <option value="已保養" ${r.status==='已保養'?'selected':''}>已保養</option>
                            <option value="已逾期" ${r.status==='已逾期'?'selected':''}>已逾期</option>
                        </select>
                    </td>
                    <td>${r.remarks||''}</td>
                    <td>
                        <button class="action-btn edit-btn" onclick="editRecord('${r.id}')"><i class="fa-solid fa-pen"></i></button>
                        <button class="action-btn delete-btn" onclick="deleteRecord('${r.id}')"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            renderPagination(totalItems, totalPages);
        }

        function renderPagination(totalItems, totalPages) {
            const div = document.getElementById('pagination'); div.innerHTML = '';
            if (totalPages <= 1) return;
            for (let i = 1; i <= totalPages; i++) {
                let btn = document.createElement('button'); btn.className = `page-btn ${i === currentPage ? 'active' : ''}`; btn.innerText = i;
                btn.onclick = () => { currentPage = i; renderMaintenanceTable(document.getElementById('searchInput').value); };
                div.appendChild(btn);
            }
        }

        function calculateNextDate(dateStr, frequencyMonths) { 
            let date = new Date(dateStr); 
            let freq = parseFloat(frequencyMonths) || 1; 
            let addDays = Math.round(freq * 30);
            date.setDate(date.getDate() + addDays);
            return date.toISOString().split('T')[0];
        }

        function calculateDaysDiff(targetDateStr) { const today = new Date(); today.setHours(0,0,0,0); const target = new Date(targetDateStr); return Math.ceil((target - today) / (1000 * 60 * 60 * 24)); }
        
        function updateCustomerList() { records.forEach(r => { if (!customers[r.customer]) customers[r.customer] = '正常營業'; }); saveData(); }
        
        function renderAll() { renderDashboard(); renderMaintenanceTable(); renderCustomersTable(); updateYearSelect(); renderHistoryTable(); }
        
        // 💡 包含自動計算逾期與 30 天內提醒的儀表板邏輯
        function renderDashboard() {
            document.getElementById('count-total').innerText = records.length;
            let p = 0, o = 0, rCount = 0; 
            
            records.forEach(r => { 
                const nextDate = calculateNextDate(r.date, r.freq);
                const daysDiff = calculateDaysDiff(nextDate);
                
                if (r.status === '已保養') {
                    // 已保養不計入待處理與逾期
                } else if (daysDiff < 0 || r.status === '已逾期') {
                    o++; // 自動計入逾期
                } else if (r.status === '待處理') {
                    p++; 
                }
            });

            const latestRecordsMap = {};
            records.forEach(r => {
                if (!latestRecordsMap[r.customer] || new Date(r.date) > new Date(latestRecordsMap[r.customer].date)) {
                    latestRecordsMap[r.customer] = r;
                }
            });

            Object.values(latestRecordsMap).forEach(r => {
                if (customers[r.customer] !== '已歇業') {
                    let d = calculateDaysDiff(calculateNextDate(r.date, r.freq));
                    if (d <= 30 && d >= 0) {
                        rCount++;
                    }
                }
            });
            
            document.getElementById('count-pending').innerText = p; 
            document.getElementById('count-overdue').innerText = o; 
            document.getElementById('count-remind').innerText = rCount;
        }

        function renderCustomersTable(filterText) {
            const tbody = document.getElementById('customers-table-body'); tbody.innerHTML = '';
            const searchInput = document.getElementById('searchInput');
            const text = (filterText !== undefined && filterText !== '') ? filterText : (searchInput ? searchInput.value : '');

            let arr = Object.entries(customers); 
            if(text) arr = arr.filter(([n])=>n.toLowerCase().includes(text.toLowerCase()));
            
            const p = arr.slice((currentCustomerPage-1)*recordsPerPage, currentCustomerPage*recordsPerPage);
            p.forEach(([name, status]) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `<td>${name}</td><td><span class="badge ${status==='正常營業'?'badge-done':'badge-overdue'}" style="cursor:pointer;" onclick="toggleCustomerStatus('${name}')">${status}</span></td>`;
                tbody.appendChild(tr);
            });
            const div = document.getElementById('pagination-customers'); div.innerHTML = '';
            const totalPages = Math.ceil(arr.length / recordsPerPage) || 1;
            if (totalPages > 1) {
                for (let i = 1; i <= totalPages; i++) {
                    let btn = document.createElement('button'); btn.className = `page-btn ${i === currentCustomerPage ? 'active' : ''}`; btn.innerText = i;
                    btn.onclick = () => { currentCustomerPage = i; renderCustomersTable(text); };
                    div.appendChild(btn);
                }
            }
        }

        function updateYearSelect() { 
            const yearSelect = document.getElementById('historyYearSelect'); 
            const itemSelect = document.getElementById('historyItemSelect');
            if (!yearSelect || !itemSelect) return;

            let yrs = new Set(); 
            let items = new Set();
            records.forEach(r => {
                if (r.date) yrs.add(r.date.substring(0, 4));
                if (r.item && r.item.trim() !== '') items.add(r.item.trim());
            }); 
            
            yearSelect.innerHTML = '<option value="all">全部</option>'; 
            Array.from(yrs).sort().reverse().forEach(y => yearSelect.innerHTML += `<option value="${y}">${y}</option>`); 
            
            itemSelect.innerHTML = '<option value="all">全部項目</option>';
            Array.from(items).sort().forEach(item => itemSelect.innerHTML += `<option value="${item}">${item}</option>`);
        }
        
        function renderHistoryTable(filterText) {
            const tbody = document.getElementById('history-table-body'); tbody.innerHTML = '';
            const searchInput = document.getElementById('searchInput');
            const text = (filterText !== undefined && filterText !== '') ? filterText : (searchInput ? searchInput.value : '');

            const selectedYear = document.getElementById('historyYearSelect').value;
            const selectedItem = document.getElementById('historyItemSelect').value;

            let f = records; 
            if (text) f = f.filter(r => r.customer.toLowerCase().includes(text.toLowerCase()));
            if (selectedYear !== 'all') f = f.filter(r => r.date && r.date.startsWith(selectedYear));
            if (selectedItem !== 'all') f = f.filter(r => r.item === selectedItem);
            
            f.slice(0, 50).forEach(r => {
                let tr = document.createElement('tr');
                tr.innerHTML = `<td>${r.date.replace(/-/g,'/')}</td><td>${r.customer}</td><td>${r.item}</td><td>${r.freq}月</td><td>${r.status}</td>`;
                tbody.appendChild(tr);
            });
        }

        function switchTab(id, el) { document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active')); document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById(id).classList.add('active'); el.classList.add('active'); handleSearch(false); }
        function handleSearch(reset=true) { if(reset){currentPage=1; currentCustomerPage=1;} const t=document.getElementById('searchInput').value; renderMaintenanceTable(t); renderCustomersTable(t); renderHistoryTable(t); }
        function openModal() { updateCustomerDatalist(); document.getElementById('modalTitle').innerText='新增登記保養'; document.getElementById('recordForm').reset(); document.getElementById('recordId').value=''; document.getElementById('mDate').value=new Date().toISOString().split('T')[0]; document.getElementById('recordModal').style.display='flex'; }
        function closeModal() { document.getElementById('recordModal').style.display='none'; }
        
        document.getElementById('recordForm').addEventListener('submit', (e) => { 
            e.preventDefault(); 
            const id = document.getElementById('recordId').value; 
            const d = {
                id: id||Math.random().toString(36).substr(2,9), 
                date: document.getElementById('mDate').value, 
                customer: document.getElementById('mCustomer').value.trim(), 
                item: document.getElementById('mItem').value.trim(), 
                freq: parseFloat(document.getElementById('mFreq').value) || 1, 
                status: document.getElementById('mStatus').value, 
                remarks: document.getElementById('mRemarks').value
            }; 
            if(id){const idx=records.findIndex(r=>r.id===id); records[idx]=d;}else{records.push(d); currentPage=1; currentCustomerPage=1;} 
            updateCustomerList(); saveData(); document.getElementById('searchInput').value=''; renderAll(); closeModal(); 
        });

        function editRecord(id) { 
            updateCustomerDatalist(); 
            const r=records.find(r=>r.id===id); 
            if(r){ 
                document.getElementById('modalTitle').innerText='編輯保養紀錄'; 
                document.getElementById('recordId').value=r.id; 
                document.getElementById('mDate').value=r.date; 
                document.getElementById('mCustomer').value=r.customer; 
                document.getElementById('mItem').value=r.item; 
                document.getElementById('mFreq').value=r.freq; 
                document.getElementById('mStatus').value=r.status; 
                document.getElementById('mRemarks').value=r.remarks; 
                document.getElementById('recordModal').style.display='flex'; 
            } 
        }

        function deleteRecord(id) { if(confirm('確定刪除?')) { records=records.filter(r=>r.id!==id); saveData(); renderAll(); } }
        function changeRecordStatus(id, s) { const idx=records.findIndex(r=>r.id===id); if(idx!==-1){ records[idx].status=s; saveData(); renderDashboard(); renderHistoryTable(); } }
        function toggleCustomerStatus(n) { const s=customers[n]; const ns=s==='正常營業'?'已歇業':'正常營業'; if(confirm(`將「${n}」變更為「${ns}」嗎?`)){ customers[n]=ns; saveData(); renderCustomersTable(document.getElementById('searchInput').value); } }
        
        function checkReminders(initial=false) {
            const latestRecordsMap = {};
            records.forEach(r => {
                if (!latestRecordsMap[r.customer] || new Date(r.date) > new Date(latestRecordsMap[r.customer].date)) {
                    latestRecordsMap[r.customer] = r;
                }
            });

            currentReminderData = Object.values(latestRecordsMap).filter(r => {
                if (customers[r.customer] === '已歇業') return false;
                const nextDateStr = calculateNextDate(r.date, r.freq);
                const daysLeft = calculateDaysDiff(nextDateStr);
                return daysLeft >= 0 && daysLeft <= 30;
            });

            if(currentReminderData.length > 0) {
                const searchInput = document.getElementById('reminderSearchInput');
                if (searchInput) searchInput.value = ''; 
                renderReminderTable(currentReminderData);
                document.getElementById('reminderModal').style.display = 'flex';
            }
        }

        function renderReminderTable(data) {
            const tbody = document.getElementById('reminder-table-body'); 
            if (!tbody) return;
            tbody.innerHTML = '';
            
            data.sort((a, b) => {
                return calculateDaysDiff(calculateNextDate(a.date, a.freq)) - calculateDaysDiff(calculateNextDate(b.date, b.freq));
            }).forEach(r => {
                const nextDate = calculateNextDate(r.date, r.freq);
                const days = calculateDaysDiff(nextDate);
                let tr = document.createElement('tr');
                tr.innerHTML = `<td style="color:var(--danger);font-weight:bold;">${nextDate.replace(/-/g, '/')}</td><td>${r.customer}</td><td>${r.item}</td><td>剩餘 ${days} 天</td>`;
                tbody.appendChild(tr);
            });
        }

        function filterReminderTable() {
            const searchInput = document.getElementById('reminderSearchInput');
            if (!searchInput) return;
            const keyword = searchInput.value.toLowerCase();
            const filtered = currentReminderData.filter(r => 
                r.item.toLowerCase().includes(keyword) || r.customer.toLowerCase().includes(keyword)
            );
            renderReminderTable(filtered);
        }

        function closeReminderModal() { document.getElementById('reminderModal').style.display = 'none'; }

        // 💡 防亂碼的 Excel 匯出 (提醒清單)
        function exportReminderExcel() {
            const searchInput = document.getElementById('reminderSearchInput');
            const keyword = searchInput ? searchInput.value.toLowerCase() : '';
            const exportData = currentReminderData.filter(r => 
                r.item.toLowerCase().includes(keyword) || r.customer.toLowerCase().includes(keyword)
            );
            if(exportData.length === 0) { alert('沒有資料可匯出！'); return; }
            
            let html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">';
            html += '<head><meta charset="UTF-8"></head><body>';
            html += '<table border="1">';
            html += '<tr style="background-color: #f0ad4e; color: white;"><th>下次保養日</th><th>客戶名稱</th><th>保養項目</th><th>距離天數</th></tr>';
            
            exportData.forEach(r => {
                const nextDate = calculateNextDate(r.date, r.freq);
                const days = calculateDaysDiff(nextDate);
                html += `<tr><td>${nextDate.replace(/-/g, '/')}</td><td>${r.customer}</td><td>${r.item}</td><td>剩餘 ${days} 天</td></tr>`;
            });
            html += '</table></body></html>';
            
            const blob = new Blob([html], { type: 'application/vnd.ms-excel;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `外包商提醒名單_${new Date().toISOString().split('T')[0]}.xls`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link); 
        }

        function updateRecordFreq(id, newFreq) {
            const record = records.find(x => x.id === id);
            if (record) {
                record.freq = parseFloat(newFreq) || 1; 
                saveData();
                renderAll();
            }
        }

        function importCSV(e) {
            const f = e.target.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = (e) => {
                const lines = e.target.result.split(/\r\n|\n/);
                records = []; customers = {};
                for(let i=1; i<lines.length; i++) { 
                    if(!lines[i].trim()) continue; 
                    const c = lines[i].split(',').map(x=>x.replace(/^"|"$/g, '').trim()); 
                    if(c.length>=4) {
                        records.push({
                            id: Math.random().toString(36).substr(2,9), 
                            date: c[0].trim().replace(/\//g, '-'), 
                            customer: c[1], 
                            item: c[2], 
                            freq: parseFloat(c[3]) || 1, 
                            status: c[4] || '待處理', 
                            remarks: c[5] || ''
                        });
                    }
                }
                updateCustomerList(); saveData(); currentPage=1; currentCustomerPage=1; renderAll(); 
                alert(`匯入成功！目前共有 ${records.length} 筆資料。`); 
                document.getElementById('csvFileInput').value=''; 
                checkReminders(); 
            };
            r.readAsText(f);
        }

        // 💡 防亂碼的 Excel 匯出 (主清單)
        function exportExcel() {
            if (records.length === 0) { alert('沒有資料可匯出！'); return; }
            let html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">';
            html += '<head><meta charset="UTF-8"></head><body>';
            html += '<table border="1">';
            html += '<tr style="background-color: #B8906F; color: white;"><th>保養日期</th><th>客戶名稱</th><th>保養項目</th><th>保養頻率(月)</th><th>保養狀況</th><th>備註</th></tr>';
            
            records.forEach(r => {
                html += `<tr><td>${r.date.replace(/-/g, '/')}</td><td>${r.customer}</td><td>${r.item}</td><td>${r.freq}</td><td>${r.status}</td><td>${r.remarks || ''}</td></tr>`;
            });
            html += '</table></body></html>';
            
            const blob = new Blob([html], { type: 'application/vnd.ms-excel;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `保養資料匯出_${new Date().toISOString().split('T')[0]}.xls`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function exportHTML() { let timestamp=Date.now(); let recordsStr=JSON.stringify(records); let customersStr=JSON.stringify(customers); let currentTheme=localStorage.getItem('cc_theme')||'milktea'; let scriptContent=`\n        window.EMBEDDED_TIMESTAMP = ${timestamp};\n        window.EMBEDDED_RECORDS = ${recordsStr};\n        window.EMBEDDED_CUSTOMERS = ${customersStr};\n        window.EMBEDDED_THEME = '${currentTheme}';\n    `; let clone=document.documentElement.cloneNode(true); clone.querySelector('#embedded-data').textContent=scriptContent; const blob=new Blob(["<!DOCTYPE html>\n<html lang=\"zh-TW\">\n"+clone.innerHTML+"\n</html>"], {type:'text/html;charset=utf-8;'}); const link=document.createElement("a"); link.href=URL.createObjectURL(blob); link.download=`保養儀表板_${new Date().toISOString().split('T')[0]}.html`; link.click(); alert('打包完成！請將下載的檔案分享給同事。'); }

          function updateOverdueStatuses() {
            let changed = false;
            records.forEach(r => {
                if (r.status !== '已保養') {
                    const nextDate = calculateNextDate(r.date, r.freq);
                    const daysDiff = calculateDaysDiff(nextDate);
                    // 如果下次保養日已經過去（天數 < 0），且目前還不是「已逾期」，就自動幫忙改過去！
                    if (daysDiff < 0 && r.status !== '已逾期') {
                        r.status = '已逾期';
                        changed = true;
                    }
                }
            });
            if (changed) {
                saveData(); // 自動儲存狀態變更
            }
        }
        
        function clearAllData() { 
            if(confirm('⚠️確定清除所有資料?')) { 
                records=[]; customers={}; currentPage=1; currentCustomerPage=1; 
                localStorage.removeItem('cc_records'); localStorage.removeItem('cc_customers');
                localStorage.setItem('cc_timestamp', Date.now());
                renderAll(); alert('資料已完全清空！'); 
            } 
        }
        function exportPDF() { html2pdf().from(document.getElementById('tab-history')).save('歷史紀錄.pdf'); }
    </script>
</body>
</html>
